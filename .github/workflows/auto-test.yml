# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see https://help.github.com/en/actions/language-and-framework-guides/language-and-framework-guides

name: Auto Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  auto-test-previous:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [ 14, 16, 17, 18 ]
    steps:
    - uses: ./.github/actions/auto-test-stage
      with:
        stage: previous
        node: ${{ matrix.node }}
        just-for-test: ${{ secrets.JUST_FOR_TEST }}

  auto-test-risk:
    needs: [ auto-test-previous ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [ 14, 16, 17, 18 ]
    steps:
    - uses: ./.github/actions/auto-test-stage
      with:
        stage: risk
        prior-stage: previous
        node: ${{ matrix.node }}
        just-for-test: ${{ secrets.JUST_FOR_TEST }}

  auto-test:
    needs: [ auto-test-risk ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [ 14, 16, 17, 18 ]
    steps:
    - uses: ./.github/actions/auto-test-stage
      with:
        stage: canonical
        prior-stage: risk
        node: ${{ matrix.node }}
        just-for-test: ${{ secrets.JUST_FOR_TEST }}

  check-linters:
    needs: [ auto-test ]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - run: git config --global core.autocrlf false  # Mainly for Windows
    - uses: actions/checkout@v3

    - name: Use Node.js 14
      uses: actions/setup-node@v3
      with:
        node-version: 14
        cache: 'npm'
    - run: npm install
    - run: npm run lint

  e2e-tests:
    needs: [ check-linters, auto-test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - run: git config --global core.autocrlf false  # Mainly for Windows
    - uses: actions/checkout@v3

    - name: Use Node.js 14
      uses: actions/setup-node@v3
      with:
        node-version: 14
        cache: 'npm'
    - run: npm install
    - run: npm run build
    - run: npm run cy:test
